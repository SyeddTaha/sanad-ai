project_id = "sanad-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

# Use npm run db:migrate for both local and hosted databases; it maintains checksums.
[db.migrations]
enabled = false

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 16

[auth.email]
enabled = true
enable_confirmations = true
